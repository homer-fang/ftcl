<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
<style>
text{font-family:'AR PL UMing TW MBE','AR PL UMing CN','FandolHei','Microsoft YaHei','SimHei',Arial,Helvetica,sans-serif;fill:#111827;}
.title{font-size:40px;font-weight:700;}
.subtitle{font-size:20px;fill:#475569;}
.label{font-size:22px;font-weight:700;}
.small{font-size:18px;fill:#475569;}
.tiny{font-size:16px;fill:#64748b;}
.axis{font-size:18px;fill:#374151;}
.box{stroke:#1f2937;stroke-width:1.4;rx:14;ry:14;}
</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#334155" />
</marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
</filter>
</defs>
<rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
<text class="title" x="70.00" y="58.00" text-anchor="start">执行时间对比（execution time）</text>
<text class="subtitle" x="70.00" y="96.00" text-anchor="start">本次论文模式最大规模：N=32768；数值越低越好。</text>
<line x1="120" y1="550.00" x2="1110" y2="550.00" stroke="#e5e7eb"/>
<text class="axis" x="108.00" y="554.00" text-anchor="end">0.00</text>
<line x1="120" y1="475.18" x2="1110" y2="475.18" stroke="#e5e7eb"/>
<text class="axis" x="108.00" y="479.18" text-anchor="end">100.0k</text>
<line x1="120" y1="400.36" x2="1110" y2="400.36" stroke="#e5e7eb"/>
<text class="axis" x="108.00" y="404.36" text-anchor="end">200.0k</text>
<line x1="120" y1="325.53" x2="1110" y2="325.53" stroke="#e5e7eb"/>
<text class="axis" x="108.00" y="329.53" text-anchor="end">300.0k</text>
<line x1="120" y1="250.71" x2="1110" y2="250.71" stroke="#e5e7eb"/>
<text class="axis" x="108.00" y="254.71" text-anchor="end">400.0k</text>
<line x1="120" y1="175.89" x2="1110" y2="175.89" stroke="#e5e7eb"/>
<text class="axis" x="108.00" y="179.89" text-anchor="end">500.0k</text>
<line x1="120" y1="130" x2="120" y2="550" stroke="#111827" stroke-width="1.4"/>
<line x1="120" y1="550" x2="1110" y2="550" stroke="#111827" stroke-width="1.4"/>
<rect x="204.36" y="205.74" width="72" height="344.26" fill="#94a3b8" rx="5"/>
<text class="tiny" x="240.36" y="198.74" text-anchor="middle">460.1k</text>
<rect x="293.64" y="548.46" width="72" height="1.54" fill="#2563eb" rx="5"/>
<text class="tiny" x="329.64" y="541.46" text-anchor="middle">2.1k</text>
<text class="axis" x="285.00" y="596.00" text-anchor="middle"><tspan x="285.00" dy="0.00">距离矩阵（distance matrix）</tspan></text>
<rect x="534.36" y="457.77" width="72" height="92.23" fill="#94a3b8" rx="5"/>
<text class="tiny" x="570.36" y="450.77" text-anchor="middle">123.3k</text>
<rect x="623.64" y="544.43" width="72" height="5.57" fill="#16a34a" rx="5"/>
<text class="tiny" x="659.64" y="537.43" text-anchor="middle">7.4k</text>
<text class="axis" x="615.00" y="596.00" text-anchor="middle"><tspan x="615.00" dy="0.00">最近点（nearest point）</tspan></text>
<rect x="864.36" y="522.71" width="72" height="27.29" fill="#94a3b8" rx="5"/>
<text class="tiny" x="900.36" y="515.71" text-anchor="middle">36.5k</text>
<rect x="953.64" y="547.92" width="72" height="2.08" fill="#f59e0b" rx="5"/>
<text class="tiny" x="989.64" y="540.92" text-anchor="middle">2.8k</text>
<text class="axis" x="945.00" y="596.00" text-anchor="middle"><tspan x="945.00" dy="0.00">圆形范围计数（circle range count）</tspan></text>
<text class="axis" x="28" y="340.00" transform="rotate(-90 28 340.00)">时间（微秒，us）</text>
<rect x="930" y="98" width="18" height="12" fill="#94a3b8"/><text class="tiny" x="956" y="109">CPU</text>
<rect x="930" y="122" width="18" height="12" fill="#2563eb"/><text class="tiny" x="956" y="133">CUDA（颜色按算法区分）</text>
</svg>
