<text class="label" x="760.00" y="150.00" text-anchor="start">Script excerpt</text>
<rect x="740" y="160" width="450" height="340" rx="14" fill="#0f172a"/>
<text class="code" x="762" y="198">set world [geom uvec_points $map_points cuda:0]</text>
<text class="code" x="762" y="246">set enemy [geom uvec_points $enemy_points cuda:0]</text>
<text class="code" x="762" y="294">set player [geom uvec_points {{$px $py}} cuda:0]</text>
<text class="code" x="762" y="342">set nearest [geom nearest_point $enemy $player cuda:0]</text>
<text class="code" x="762" y="390">set count [geom range_count_circle $enemy $radar 8.0 cuda:0]</text>
<text class="code" x="762" y="438">set hit [geom collision_aabb $player_box $wall_box cuda:0]</text>
<text class="small" x="945.00" y="520.00" text-anchor="middle"><tspan x="945.00" dy="0.00">Output semantics:</tspan><tspan x="945.00" dy="16.00">nearest -&gt; point handle</tspan><tspan x="945.00" dy="16.00">count -&gt; per-radar integer handle</tspan><tspan x="945.00" dy="16.00">hit -&gt; collision flags</tspan></text>
