<text class="label" x="760.00" y="150.00" text-anchor="start">FTCL script excerpt</text>
<rect x="740" y="160" width="450" height="378" rx="14" fill="#0f172a"/>
<text class="code" x="762" y="196">set sensors [geom uvec_points $buoys cuda:0]</text>
<text class="code" x="762" y="240">set targets [geom uvec_points $floating_objects cuda:0]</text>
<text class="code" x="762" y="284">set uav [geom uvec_points {{$ux $uy}} cuda:0]</text>
<text class="code" x="762" y="328">set near [geom nearest_point $targets $uav cuda:0]</text>
<text class="code" x="762" y="372">set cover [geom range_count_circle $targets $sonar 120 cuda:0]</text>
<text class="code" x="762" y="416">set risk [geom collision_aabb $ship_box $restricted cuda:0]</text>
<text class="code" x="762" y="460">set dist [geom batch_distance_matrix $sensors $targets cuda:0]</text>
<text class="small" x="965.00" y="572.00" text-anchor="middle"><tspan x="965.00" dy="0.00">Output semantics:</tspan><tspan x="965.00" dy="16.00">near -&gt; abnormal target handle</tspan><tspan x="965.00" dy="16.00">cover -&gt; per-sonar target counts</tspan><tspan x="965.00" dy="16.00">risk -&gt; ship/obstacle collision flags</tspan><tspan x="965.00" dy="16.00">dist -&gt; large sensor-target matrix</tspan></text>
</svg>
