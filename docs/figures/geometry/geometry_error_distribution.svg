<line x1="95" y1="90.00" x2="1050" y2="90.00" stroke="#e5e7eb"/>
<text class="axis" x="83.00" y="94.00" text-anchor="end">8</text>
<line x1="95" y1="90" x2="95" y2="520" stroke="#111827" stroke-width="1.4"/>
