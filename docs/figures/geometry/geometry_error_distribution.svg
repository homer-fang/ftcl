<text class="axis" x="108.00" y="224.00" text-anchor="end">6</text>
<line x1="120" y1="175.00" x2="1030" y2="175.00" stroke="#e5e7eb"/>
<text class="axis" x="108.00" y="179.00" text-anchor="end">7</text>
<line x1="120" y1="130.00" x2="1030" y2="130.00" stroke="#e5e7eb"/>
<text class="axis" x="108.00" y="134.00" text-anchor="end">8</text>
<line x1="120" y1="130" x2="120" y2="490" stroke="#111827" stroke-width="1.4"/>
<line x1="120" y1="490" x2="1030" y2="490" stroke="#111827" stroke-width="1.4"/>
<rect x="485.00" y="130.00" width="180.00" height="360.00" fill="#16a34a" opacity="0.78" rx="6"/>
