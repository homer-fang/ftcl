<rect x="760" y="152" width="250" height="62" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.2"/>
<text class="label" x="885.00" y="178.00" text-anchor="middle">全部检查精确一致</text>
<text class="tiny" x="885.00" y="200.00" text-anchor="middle">每个样本 max_abs_error = 0</text>
<text class="axis" x="575.00" y="576.00" text-anchor="middle">最大绝对误差（max absolute error）</text>
<text class="axis" x="28" y="310.00" transform="rotate(-90 28 310.00)">检查次数</text>
<text class="small" x="1022.00" y="150.00" text-anchor="end">样本数=8, 最大值=0</text>
