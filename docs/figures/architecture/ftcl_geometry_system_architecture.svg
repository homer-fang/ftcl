<rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>
<text class="title" x="70.00" y="44.00" text-anchor="start">FTCL geometry system architecture</text>
<text class="subtitle" x="70.00" y="66.00" text-anchor="start">Script level commands are lowered to UVec-backed CPU/CUDA geometry kernels.</text>
