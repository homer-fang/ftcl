<rect class="box" x="650.00" y="150.00" width="190.00" height="88.00" fill="#dcfce7" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="745.00" y="182.00" text-anchor="middle"><tspan x="745.00" dy="0.00">geom command</tspan><tspan x="745.00" dy="17.00">argument decode</tspan><tspan x="745.00" dy="17.00">device select</tspan></text>
<rect class="box" x="940.00" y="150.00" width="180.00" height="88.00" fill="#fef3c7" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="1030.00" y="182.00" text-anchor="middle"><tspan x="1030.00" dy="0.00">UVec</tspan><tspan x="1030.00" dy="17.00">typed handle</tspan><tspan x="1030.00" dy="17.00">valid flags</tspan></text>
<line x1="270.00" y1="194.00" x2="350.00" y2="194.00" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
