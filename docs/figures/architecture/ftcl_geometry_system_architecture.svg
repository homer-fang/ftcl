<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111827;}
.title{font-size:24px;font-weight:700;}
.subtitle{font-size:13px;fill:#475569;}
.label{font-size:14px;font-weight:700;}
.small{font-size:12px;fill:#475569;}
.tiny{font-size:10px;fill:#64748b;}
.axis{font-size:12px;fill:#374151;}
.box{stroke:#1f2937;stroke-width:1.4;rx:14;ry:14;}
</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#334155" />
</marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
</filter>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
<text class="title" x="70.00" y="44.00" text-anchor="start">FTCL geometry system architecture</text>
<text class="subtitle" x="70.00" y="66.00" text-anchor="start">A script control plane drives a UVec data plane, which selects CPU or CUDA execution backends.</text>
<rect x="80" y="120" width="1120" height="150" rx="22" fill="#eff6ff" stroke="#e2e8f0"/>
<text class="label" x="102.00" y="148.00" text-anchor="start">1  Script control plane</text>
<rect x="80" y="305" width="1120" height="160" rx="22" fill="#fffbeb" stroke="#e2e8f0"/>
<text class="label" x="102.00" y="333.00" text-anchor="start">2  UVec data abstraction plane</text>
<rect x="80" y="500" width="1120" height="135" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
<text class="label" x="102.00" y="528.00" text-anchor="start">3  Execution backend plane</text>
<rect class="box" x="125.00" y="165.00" width="170.00" height="72.00" fill="#dbeafe" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="210.00" y="189.00" text-anchor="middle"><tspan x="210.00" dy="0.00">FTCL script</tspan><tspan x="210.00" dy="17.00">geom ...</tspan><tspan x="210.00" dy="17.00">thread channel</tspan></text>
<rect class="box" x="355.00" y="165.00" width="180.00" height="72.00" fill="#e0f2fe" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="445.00" y="197.50" text-anchor="middle"><tspan x="445.00" dy="0.00">Lexer / Parser</tspan><tspan x="445.00" dy="17.00">command + words</tspan></text>
<rect class="box" x="595.00" y="165.00" width="205.00" height="72.00" fill="#e0f2fe" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="697.50" y="189.00" text-anchor="middle"><tspan x="697.50" dy="0.00">Interpreter</tspan><tspan x="697.50" dy="17.00">substitution</tspan><tspan x="697.50" dy="17.00">command dispatch</tspan></text>
<rect class="box" x="875.00" y="165.00" width="190.00" height="72.00" fill="#dcfce7" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="970.00" y="189.00" text-anchor="middle"><tspan x="970.00" dy="0.00">geom command</tspan><tspan x="970.00" dy="17.00">decode args</tspan><tspan x="970.00" dy="17.00">select device</tspan></text>
<line x1="295.00" y1="201.00" x2="355.00" y2="201.00" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<text class="tiny" x="325.00" y="191.00" text-anchor="middle">parse</text>
<line x1="535.00" y1="201.00" x2="595.00" y2="201.00" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<text class="tiny" x="565.00" y="191.00" text-anchor="middle">evaluate</text>
<line x1="800.00" y1="201.00" x2="875.00" y2="201.00" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<text class="tiny" x="837.50" y="191.00" text-anchor="middle">dispatch</text>
<rect class="box" x="180.00" y="350.00" width="220.00" height="76.00" fill="#fff7ed" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="290.00" y="384.50" text-anchor="middle"><tspan x="290.00" dy="0.00">Result value</tspan><tspan x="290.00" dy="17.00">usually a UVec handle</tspan></text>
<rect class="box" x="480.00" y="330.00" width="360.00" height="116.00" fill="#fef3c7" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="660.00" y="376.00" text-anchor="middle"><tspan x="660.00" dy="0.00">UVec handle manager</tspan><tspan x="660.00" dy="17.00">id -&gt; typed vector</tspan><tspan x="660.00" dy="17.00">per-handle lock</tspan></text>
<rect class="box" x="920.00" y="330.00" width="220.00" height="116.00" fill="#fef3c7" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="1030.00" y="376.00" text-anchor="middle"><tspan x="1030.00" dy="0.00">UVec object</tspan><tspan x="1030.00" dy="17.00">CPU/CUDA buffers</tspan><tspan x="1030.00" dy="17.00">valid flags</tspan></text>
<line x1="970.00" y1="237.00" x2="1030.00" y2="330.00" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<text class="tiny" x="1000.00" y="273.50" text-anchor="middle">lookup handle</text>
<line x1="840.00" y1="388.00" x2="920.00" y2="388.00" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<text class="tiny" x="880.00" y="378.00" text-anchor="middle">typed access</text>
<line x1="480.00" y1="388.00" x2="400.00" y2="388.00" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text class="tiny" x="440.00" y="378.00" text-anchor="middle">return handle</text>
<rect class="box" x="190.00" y="545.00" width="220.00" height="72.00" fill="#f1f5f9" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="300.00" y="569.00" text-anchor="middle"><tspan x="300.00" dy="0.00">CPU backend</tspan><tspan x="300.00" dy="17.00">std::vector view</tspan><tspan x="300.00" dy="17.00">scalar loops</tspan></text>
<rect class="box" x="530.00" y="545.00" width="230.00" height="72.00" fill="#ede9fe" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="645.00" y="569.00" text-anchor="middle"><tspan x="645.00" dy="0.00">CUDA backend</tspan><tspan x="645.00" dy="17.00">device pointer</tspan><tspan x="645.00" dy="17.00">kernel launch</tspan></text>
<rect class="box" x="875.00" y="545.00" width="230.00" height="72.00" fill="#ede9fe" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="990.00" y="569.00" text-anchor="middle"><tspan x="990.00" dy="0.00">Multi-GPU workers</tspan><tspan x="990.00" dy="17.00">cuda:0 ... cuda:7</tspan><tspan x="990.00" dy="17.00">independent handles</tspan></text>
<line x1="985.00" y1="446.00" x2="300.00" y2="545.00" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<text class="tiny" x="642.50" y="485.50" text-anchor="middle">as_uptr(cpu)</text>
<line x1="1030.00" y1="446.00" x2="645.00" y2="545.00" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow)"/>
<text class="tiny" x="837.50" y="485.50" text-anchor="middle">as_uptr(cuda:0)</text>
<line x1="1070.00" y1="446.00" x2="990.00" y2="545.00" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text class="tiny" x="1030.00" y="485.50" text-anchor="middle">partitioned handles</text>
<text class="label" x="140.00" y="680.00" text-anchor="start">Key idea:</text>
<text class="subtitle" x="225.00" y="680.00" text-anchor="start">scripts move small handles; UVec keeps large geometry arrays resident until a final readback is needed.</text>
</svg>
