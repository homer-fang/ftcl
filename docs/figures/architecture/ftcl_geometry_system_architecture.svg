<rect class="box" x="80.00" y="390.00" width="490.00" height="74.00" fill="#fff7ed" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="325.00" y="423.50" text-anchor="middle"><tspan x="325.00" dy="0.00">Result returns as an FTCL value</tspan><tspan x="325.00" dy="17.00">Most batch algorithms return a UVec handle, so scripts can continue without copying immediately.</tspan></text>
<line x1="940.00" y1="194.00" x2="570.00" y2="427.00" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="693.00" y="292.50" width="124" height="20" rx="10" fill="#ffffff" opacity="0.92"/>
