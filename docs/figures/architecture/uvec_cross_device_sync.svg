<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111827;}
.title{font-size:24px;font-weight:700;}
.subtitle{font-size:13px;fill:#475569;}
.label{font-size:14px;font-weight:700;}
.small{font-size:12px;fill:#475569;}
.tiny{font-size:10px;fill:#64748b;}
.axis{font-size:12px;fill:#374151;}
.box{stroke:#1f2937;stroke-width:1.4;rx:14;ry:14;}
</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#334155" />
</marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
</filter>
</defs>
<rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>
<text class="title" x="70.00" y="44.00" text-anchor="start">UVec cross-device synchronization</text>
<text class="subtitle" x="70.00" y="66.00" text-anchor="start">Only the latest buffer is authoritative. Reads trigger copy; writes invalidate stale copies.</text>
<rect class="box" x="90.00" y="180.00" width="300.00" height="120.00" fill="#dbeafe" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="240.00" y="228.00" text-anchor="middle"><tspan x="240.00" dy="0.00">CPU buffer</tspan><tspan x="240.00" dy="17.00">host pointer</tspan><tspan x="240.00" dy="17.00">valid flag: 0/1</tspan></text>
<rect class="box" x="810.00" y="180.00" width="300.00" height="120.00" fill="#ede9fe" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="960.00" y="228.00" text-anchor="middle"><tspan x="960.00" dy="0.00">CUDA buffer</tspan><tspan x="960.00" dy="17.00">device pointer</tspan><tspan x="960.00" dy="17.00">valid flag: 0/1</tspan></text>
<rect class="box" x="475.00" y="190.00" width="250.00" height="100.00" fill="#fef3c7" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="600.00" y="228.00" text-anchor="middle"><tspan x="600.00" dy="0.00">UVec metadata</tspan><tspan x="600.00" dy="17.00">latest = cpu/cuda:0</tspan><tspan x="600.00" dy="17.00">length, type, buffers</tspan></text>
<line x1="390.00" y1="225.00" x2="475.00" y2="225.00" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="370.50" y="207.00" width="124" height="20" rx="10" fill="#ffffff" opacity="0.92"/>
<text class="tiny" x="432.50" y="221.00" text-anchor="middle">read/write</text>
<line x1="725.00" y1="225.00" x2="810.00" y2="225.00" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="705.50" y="207.00" width="124" height="20" rx="10" fill="#ffffff" opacity="0.92"/>
<text class="tiny" x="767.50" y="221.00" text-anchor="middle">read/write</text>
<line x1="395.00" y1="275.00" x2="805.00" y2="275.00" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="538.00" y="257.00" width="124" height="20" rx="10" fill="#ffffff" opacity="0.92"/>
<text class="tiny" x="600.00" y="271.00" text-anchor="middle">CPU -&gt; CUDA copy</text>
<line x1="805.00" y1="205.00" x2="395.00" y2="205.00" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="538.00" y="187.00" width="124" height="20" rx="10" fill="#ffffff" opacity="0.92"/>
<text class="tiny" x="600.00" y="201.00" text-anchor="middle">CUDA -&gt; CPU copy</text>
<rect class="box" x="110.00" y="430.00" width="260.00" height="92.00" fill="#eff6ff" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="240.00" y="464.00" text-anchor="middle"><tspan x="240.00" dy="0.00">CPU write</tspan><tspan x="240.00" dy="17.00">cpu valid = 1</tspan><tspan x="240.00" dy="17.00">cuda valid = 0</tspan></text>
<rect class="box" x="470.00" y="430.00" width="260.00" height="92.00" fill="#f5f3ff" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="600.00" y="464.00" text-anchor="middle"><tspan x="600.00" dy="0.00">CUDA read</tspan><tspan x="600.00" dy="17.00">if cuda invalid</tspan><tspan x="600.00" dy="17.00">copy CPU -&gt; CUDA</tspan></text>
<rect class="box" x="830.00" y="430.00" width="260.00" height="92.00" fill="#f5f3ff" stroke="#1f2937" filter="url(#shadow)"/>
<text class="small" x="960.00" y="464.00" text-anchor="middle"><tspan x="960.00" dy="0.00">CUDA write</tspan><tspan x="960.00" dy="17.00">cuda valid = 1</tspan><tspan x="960.00" dy="17.00">cpu valid = 0</tspan></text>
<line x1="370.00" y1="476.00" x2="470.00" y2="476.00" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="358.00" y="458.00" width="124" height="20" rx="10" fill="#ffffff" opacity="0.92"/>
<text class="tiny" x="420.00" y="472.00" text-anchor="middle">kernel input</text>
<line x1="730.00" y1="476.00" x2="830.00" y2="476.00" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="718.00" y="458.00" width="124" height="20" rx="10" fill="#ffffff" opacity="0.92"/>
<text class="tiny" x="780.00" y="472.00" text-anchor="middle">kernel output</text>
<text class="subtitle" x="600.00" y="594.00" text-anchor="middle">This is the bridge that lets FTCL scripts call CPU and CUDA kernels through the same UVec handle.</text>
</svg>
